<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Pinch-zoom is deliberately NOT disabled. This app's only reading surface is
       small text in a gym, and with every size absolute px as well, there was no
       route to larger text by any means. `viewport-fit=cover` stays — the
       safe-area tokens depend on it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trainer</title>

  <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trainer">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!--
    The muscle-group sprite.

    Eleven marks, one per value in `MUSCLE_GROUPS`, referenced by `<use>` from
    every exercise row in the app. Keyed on the *group* rather than on the
    exercise, which is the whole reason it is affordable: `normaliseMuscleGroup`
    folds every spelling into one of these eleven, and it runs on a lift created
    on a phone mid-workout just as it does on a seeded one. Per-exercise artwork
    would have been ~150 KB and would still have had nothing to draw for a lift
    somebody invents at the rack.

    About 1.8 KB, in a file the service worker already precaches — so no new
    request, no new module, no new SHELL entry. For comparison, the typeface is
    96 KB.

    These are category marks, not anatomy. At 21px the job is to be *told apart*
    down the leading edge of a long list, so they are deliberately geometric and
    deliberately different from each other rather than accurate.

    Stroke, width, caps and joins all come from `.ex-glyph svg` so each symbol
    carries only its own path.
  -->
  <svg xmlns="http://www.w3.org/2000/svg" hidden aria-hidden="true">
    <symbol id="m-chest" viewBox="0 0 24 24"><path d="M5 9h14M5 9v4a3 3 0 0 0 6 0V9M19 9v4a3 3 0 0 1-6 0V9"/></symbol>
    <symbol id="m-back" viewBox="0 0 24 24"><path d="M4 6l8 12 8-12M8 6v4M16 6v4"/></symbol>
    <symbol id="m-shoulders" viewBox="0 0 24 24"><path d="M6 17a6 6 0 0 1 12 0M4 17h2M18 17h2"/></symbol>
    <symbol id="m-triceps" viewBox="0 0 24 24"><path d="M9 5v8a3 3 0 0 0 6 0V5"/></symbol>
    <symbol id="m-biceps" viewBox="0 0 24 24"><path d="M4 17c3 0 4-9 8-9s5 9 8 9"/></symbol>
    <symbol id="m-forearms" viewBox="0 0 24 24"><path d="M5 8h14l-4 9H9z"/></symbol>
    <symbol id="m-quads" viewBox="0 0 24 24"><path d="M12 4c4 0 5 6 5 9a5 5 0 0 1-10 0c0-3 1-9 5-9z"/></symbol>
    <symbol id="m-hamstrings" viewBox="0 0 24 24"><path d="M5 6c0 8 3 12 7 12s7-4 7-12"/></symbol>
    <symbol id="m-glutes" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0-8 0 4 4 0 0 0 8 0zM20 12a4 4 0 1 0-8 0 4 4 0 0 0 8 0z"/></symbol>
    <symbol id="m-calves" viewBox="0 0 24 24"><path d="M12 4l5 8-5 8-5-8z"/></symbol>
    <symbol id="m-core" viewBox="0 0 24 24"><path d="M7 5h10M7 10h10M7 15h10M12 5v13"/></symbol>
  </svg>

  <div id="status-bar" class="status-bar" hidden></div>

  <main id="view" class="view"></main>

  <nav id="nav" class="nav">
    <!--
      Inline SVG, not the ▶ ▤ ◈ ✎ ⚙ glyphs that were here.

      Those were text, so they were at the mercy of whatever font resolved them
      — and on iOS two of them resolved to the *emoji* font, which is why the
      gear and the pencil rendered in full colour next to three monochrome
      shapes. They also ignored `color`, so the active tab's accent applied to
      three of the five icons and not to the other two.

      Drawn on a 24-unit grid, 2px strokes, `currentColor`, and `aria-hidden`
      because the button already has a visible text label beside it.
    -->
    <button class="nav-btn" data-route="home" type="button">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 10v4M7 7v10M17 7v10M21 10v4M7 12h10"/>
      </svg><span>Train</span>
    </button>
    <button class="nav-btn" data-route="history" type="button">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
      </svg><span>History</span>
    </button>
    <button class="nav-btn" data-route="coach" type="button">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3l2.6 5.6 5.9.8-4.3 4.3 1.1 6.1-5.3-3-5.3 3 1.1-6.1L3.5 9.4l5.9-.8z"/>
      </svg><span>Coach</span>
    </button>
    <button class="nav-btn" data-route="edit" type="button">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 7h16M4 12h10M4 17h7M17 15l4 4M21 15l-4 4"/>
      </svg><span>Edit</span>
    </button>
    <button class="nav-btn" data-route="setup" type="button">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 8h14M5 16h14"/><circle cx="9" cy="8" r="2.4"/><circle cx="15" cy="16" r="2.4"/>
      </svg><span>Setup</span>
    </button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close="1"></div>
    <div class="sheet-panel" id="sheet-panel"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
